name: Set up the benchmark
description: Check out humanizer-pro at the pinned commit and restore its corpus cache.
inputs:
  require-cache:
    description: Fail when the corpus cache is missing (run the prepare workflow first).
    default: "true"
outputs:
  sha:
    description: The pinned humanizer-pro commit.
    value: ${{ steps.ref.outputs.sha }}
  restored:
    description: Whether a corpus cache was restored.
    value: ${{ steps.corpus.outputs.cache-matched-key != '' }}
runs:
  using: composite
  steps:
    - id: ref
      shell: bash
      run: echo "sha=$(cat UPSTREAM_REF)" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: eddyplolz/humanizer-pro
        ref: ${{ steps.ref.outputs.sha }}
        path: upstream
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    # The corpus text and the manifest it was built with live only in this
    # private repo's Actions cache, never in a commit. A cache can't be
    # overwritten, so each Prepare run saves under its own key and this
    # restores the newest one for the pinned commit.
    - id: corpus
      uses: actions/cache/restore@v4
      with:
        path: |
          upstream/corpus/cache
          upstream/corpus/manifest.json
        key: corpus-${{ steps.ref.outputs.sha }}-v1-${{ github.run_id }}
        restore-keys: corpus-${{ steps.ref.outputs.sha }}-v1
    - if: inputs.require-cache == 'true' && steps.corpus.outputs.cache-matched-key == ''
      shell: bash
      run: |
        echo "::error::No corpus cache for this humanizer-pro commit. Run the Prepare workflow first."
        exit 1
